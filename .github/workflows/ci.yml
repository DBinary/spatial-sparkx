name: Tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Test CPU implementation and stored R reference results
        run: python -m pytest -q -m "not gpu"
      - name: Check installed command
        run: sparkx --help

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source archive
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: spatial-sparkx-distributions
          path: dist/*
          if-no-files-found: error
