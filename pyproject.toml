[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-sparkx"
version = "0.1.0"
description = "Native Python implementation of the SPARK-X spatial expression test"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "threadpoolctl>=3.1"]
keywords = ["SPARK-X", "spatial-transcriptomics", "spatially-variable-genes", "single-cell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/DBinary/spatial-sparkx"
Documentation = "https://github.com/DBinary/spatial-sparkx#readme"
Issues = "https://github.com/DBinary/spatial-sparkx/issues"
Validation = "https://github.com/DBinary/spatial-sparkx/blob/main/VALIDATION.md"

[project.optional-dependencies]
anndata = ["anndata>=0.10"]
test = ["pytest>=7", "anndata>=0.10", "scipy>=1.11"]

[project.scripts]
sparkx = "spatial_sparkx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["gpu: optional CUDA/CuPy checks, enabled with SPARKX_TEST_GPU=1"]
